<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NumberHub Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><nav><b>NumberHub Admin</b><a href="/">Website</a></nav><section class="panel" id="loginBox"><h1>Admin login</h1><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="loginMsg"></p></section><section id="dashboard" hidden><section class="panel"><h2>Add number</h2><div class="grid"><input id="cc" value="+91" placeholder="Country code"><input id="phone" placeholder="Phone digits"></div><button onclick="addNumber()">Add number</button></section><section class="panel"><h2>Bulk CSV import</h2><p>CSV columns: <code>country_code,phone</code></p><input id="csv" type="file" accept=".csv"><button onclick="bulkImport()">Import CSV</button><p id="bulkMsg"></p></section><section class="panel"><h2>Numbers</h2><div class="toolbar"><button onclick="loadNumbers()">Refresh</button><button class="secondary" onclick="exportSelected()">Export selected CSV</button><label class="selectall"><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)"> Select all</label></div><p id="selectedCount" class="muted">0 selected · Export contains phone numbers only</p><div id="numbers"></div></section><section class="panel"><h2>Deleted History</h2><button class="secondary" onclick="loadDeleted()">Refresh history</button><div id="deletedNumbers"></div></section><section class="panel"><h2>API keys <small>(maximum 10 active)</small></h2><input id="label" placeholder="Customer label"><button onclick="createKey()">Generate API key</button><pre id="newKey"></pre><div id="keys"></div></section><button class="secondary" onclick="logout()">Logout</button></section></main><script src="/admin.js"></script></body></html>
